# Usar con docker-compose.yml y un .env propio por ambiente.
services:
  mysql:
    ports: !reset []
  backend:
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      CORS_ORIGIN: ${ACS_WEB_ORIGIN:?Define ACS_WEB_ORIGIN}
    ports: !override
      - "127.0.0.1:${BACKEND_PORT}:3001"
  frontend:
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT}:80"
  phpmyadmin:
    profiles: ["solo-local"]
